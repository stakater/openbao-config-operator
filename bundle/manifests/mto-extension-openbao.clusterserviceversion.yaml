        the auth-method kind (cert, jwt, oidc, kubernetes, approle, userpass, ldap).
        Stamps the mount accessor on status so downstream CRs (notably OpenBaoGroupAlias)
        can bind to it without a `bao auth list` step. Optionally scoped to an OpenBao
        namespace via spec.openbaoNamespace.
      displayName: OpenBao Auth Method
      kind: OpenBaoAuthMethod
      name: openbaoauthmethods.security.mto.stakater.com
      version: v1alpha1
    - description: Cert auth-method mount-level configuration at auth/<path>/config.
        OCSP settings, identity-alias metadata, and other mount-wide tunables for
        a cert auth method. Pairs with an OpenBaoAuthMethod of type=cert at the same
        path. IsDeletable=false — bao has no DELETE endpoint for this; CR delete releases
        the finalizer without touching bao.
      displayName: OpenBao Cert Auth Engine Config
      kind: OpenBaoCertAuthEngineConfig
      name: openbaocertauthengineconfigs.security.mto.stakater.com
      version: v1alpha1
    - description: Cert auth role registration at auth/<path>/certs/<name>. Owns the
        trusted CA bundle (sourced from a Kubernetes Secret) plus the per-cert allow-list
        (allowedNames, allowedDnsSans, etc.) and the policies bao grants on a successful
        login. The Secret watch re-enqueues the CR on rotation so the bao-side cert
        stays in sync.
      displayName: OpenBao Cert Auth Engine Role
      kind: OpenBaoCertAuthEngineRole
      name: openbaocertauthengineroles.security.mto.stakater.com
      version: v1alpha1
    - description: An OpenBao identity group-alias managed by the MTO extension operator.
        Maps a (name, mountAccessor) tuple from an external auth method (OIDC, JWT,
        LDAP, …) into a parent type=external OpenBaoGroup. Bao writes at identity/group-alias
        and stores aliases keyed by id; the controller stamps the bao-side id on status.aliasId.
        canonicalGroupRef points at an OpenBaoGroup CR; canonicalId binds to a literal
        bao group id when the parent is managed out of band.
      displayName: OpenBao Group Alias
      kind: OpenBaoGroupAlias
      name: openbaogroupaliases.security.mto.stakater.com
      version: v1alpha1
    - description: An OpenBao identity group managed by the MTO extension operator.
        Owns identity/group/<name>. type=internal groups bundle policies + member
        entities/groups directly; type=external groups receive members through OpenBaoGroupAlias
        entries that map auth-method aliases into the group. Optionally scoped to
        an OpenBao namespace via spec.openbaoNamespace.
      displayName: OpenBao Group
      kind: OpenBaoGroup
      name: openbaogroups.security.mto.stakater.com
      version: v1alpha1
    - description: An OpenBao identity OIDC token role managed by the MTO extension
        operator. Owns identity/oidc/role/<name>. Mints OIDC ID tokens (signed by
        a pre-existing identity/oidc/key/<key>) for federated auth — typical use case
        is letting tenants pull AWS / GCP creds via OIDC trust. Optionally scoped
        to an OpenBao namespace via spec.openbaoNamespace.
      displayName: OpenBao Identity Token Role
      kind: OpenBaoIdentityTokenRole
      name: openbaoidentitytokenroles.security.mto.stakater.com
      version: v1alpha1
    - description: JWT/OIDC auth-method mount-level configuration at auth/<path>/config.
        OIDC discovery URL or static JWKS, client id + client_secret (read from a
        Kubernetes Secret), bound issuer, default role. Pairs with an OpenBaoAuthMethod
        of type=jwt or type=oidc at the same path. IsDeletable=false — bao has no
        DELETE; CR delete releases the finalizer without touching bao.
      displayName: OpenBao JWT/OIDC Auth Engine Config
      kind: OpenBaoJWTOIDCAuthEngineConfig
      name: openbaojwtoidcauthengineconfigs.security.mto.stakater.com
      version: v1alpha1
    - description: JWT/OIDC role at auth/<path>/role/<name>. Maps inbound JWT/OIDC
        claims (sub, email, groups, etc.) to the bao identity entity and grants a
        list of bao policies on successful login. RoleType="oidc" requires allowedRedirectUris
        for the OAuth2 callback URL set.
      displayName: OpenBao JWT/OIDC Auth Engine Role
      kind: OpenBaoJWTOIDCAuthEngineRole
      name: openbaojwtoidcauthengineroles.security.mto.stakater.com
      version: v1alpha1
    - description: An OpenBao kubernetes auth-mount config managed by the MTO extension
        operator. Owns auth/<path>/config for kubernetes-type auth methods. Surfaces
        kubernetes_host, kubernetes_ca_cert (Secret-sourced), token_reviewer_jwt (Secret-sourced),
        pem_keys, issuer, and bao tunables. Pairs with an OpenBaoAuthMethod of type=kubernetes
        at the same path. Secret-watch propagates token-reviewer JWT and CA rotations
        without operator intervention. IsDeletable=false — bao has no DELETE; CR delete
        releases the finalizer without touching bao.
      displayName: OpenBao Kubernetes Auth Engine Config
      kind: OpenBaoKubernetesAuthEngineConfig
      name: openbaokubernetesauthengineconfigs.security.mto.stakater.com
      version: v1alpha1
    - description: An OpenBao Kubernetes-auth role managed by the MTO extension operator.
        Authors a role at auth/<spec.path>/role/<name> binding service accounts in
        selected k8s namespaces (literal list or label selector) to OpenBao policies.
        Optionally scoped to an OpenBao namespace via spec.openbaoNamespace.
      displayName: OpenBao Kubernetes Auth Role
      kind: OpenBaoKubernetesAuthRole
      name: openbaokubernetesauthroles.security.mto.stakater.com
      version: v1alpha1
    - description: An OpenBao namespace lifecycle managed by the MTO extension operator.
        Owns sys/namespaces/<name>. Nested namespaces are addressed via spec.openbaoNamespace
        as the parent context. Delete is gracefully blocked until the bao namespace
        is empty (no live mounts/auth/policies/children).
      displayName: OpenBao Namespace
      kind: OpenBaoNamespace
      name: openbaonamespaces.security.mto.stakater.com
      version: v1alpha1
    - description: PKI mount configuration. Generates the root CA at <path>/root/generate/internal
        and writes the URL distribution config at <path>/config/urls. Pairs with an
        existing OpenBaoSecretEngine of kind=pki at the same path. IsDeletable=false
        — deleting the CR releases the finalizer without touching bao, because disabling
        a PKI mount loses the private key irreversibly.
      displayName: OpenBao PKI Secret Engine Config
      kind: OpenBaoPKISecretEngineConfig
      name: openbaopkisecretengineconfigs.security.mto.stakater.com
      version: v1alpha1
    - description: PKI issuance role at <path>/roles/<name>. Defines what certs may
        be issued from a PKI mount (allowed domains, key type/bits, EKU flags, TTL).
        Requires the mount to have a CA — typically configured via OpenBaoPKISecretEngineConfig
        at the same path. IsDeletable=true; CR delete removes the bao role.
      displayName: OpenBao PKI Secret Engine Role
      kind: OpenBaoPKISecretEngineRole
      name: openbaopkisecretengineroles.security.mto.stakater.com
      version: v1alpha1
    - description: An OpenBao ACL policy managed by the MTO extension operator. Authors
        a policy document in OpenBao's sys/policies/acl/ path. Optionally scoped to
        an OpenBao namespace via spec.openbaoNamespace (X-Vault-Namespace header).
      displayName: OpenBao Policy
      kind: OpenBaoPolicy
      name: openbaopolicies.security.mto.stakater.com
      version: v1alpha1
    - description: A bao-side secret-engine mount lifecycle managed by the MTO extension
        operator. Discriminated-union spec selects engine kind (kvV2 / transit / pki)
        and writes to sys/mounts/<path>. Optionally scoped to an OpenBao namespace
        via spec.openbaoNamespace. Auth-method mounts are managed elsewhere.
      displayName: OpenBao Secret Engine
      kind: OpenBaoSecretEngine
      name: openbaosecretengines.security.mto.stakater.com
      version: v1alpha1
    - description: A single transit key at <mount>/keys/<name> on a pre-existing transit
        secret-engine mount. Type, derived, convergent_encryption, and key_size are
        immutable post-create; mutation surfaces Ready=False reason=Invalid. Bao's
        deletion_allowed flag gates DELETE — when unset/false, CR delete leaves the
        CR in Terminating with Ready=False reason=DeleteBlocked until the user flips
        spec.deletionAllowed=true.
      displayName: OpenBao Transit Key
      kind: OpenBaoTransitKey
      name: openbaotransitkeys.security.mto.stakater.com
      version: v1alpha1
