name: Push Operator

# Controller image, OLM bundle, catalog, and the operator chart — which is
# helmified from config/default with the image tag this run builds, so it
# releases with the image and only with the image. The two hand-maintained
# charts publish from push_charts.yaml on their own versions.
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'examples/**'
      - 'demo/**'
      - 'hack/**'
      - 'charts/openbao-config-mto/**'
      - 'charts/openbao-config-mto-bootstrap/**'

jobs:
  push-operator:
    name: Push Operator
    if: "! contains(toJSON(github.event.commits.*.message), '[skip-ci]')"
    uses: stakater/.github/.github/workflows/operator_push.yaml@main
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.STAKATER_DELIVERY_SLACK_WEBHOOK }}
      CONTAINER_REGISTRY_URL: ghcr.io/stakater
      CONTAINER_REGISTRY_USERNAME: stakater-user
      CONTAINER_REGISTRY_PASSWORD: ${{ secrets.GHCR_TOKEN }}
      STAKATER_AB_REPOS: ${{ secrets.STAKATER_AB_REPOS }}
    with:
      ENABLE_LINTING: true
      ENABLE_UNIT_TESTS: true
      ENABLE_STAKATER_AB_GIT_AUTH: true
      # Resolves to `make helm-release`, which is the operator chart alone.
      ENABLE_CHART_PUSH: true
      GO_VERSION: "1.26"
