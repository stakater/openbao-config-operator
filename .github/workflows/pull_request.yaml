name: Pull Request

on:
  pull_request:
    branches:
      - main
      - release
    # 'hack/' is deliberately not ignored — it holds the chart render tests
    # and their golden fixtures, which the chart-tests job runs.
    paths-ignore:
      - '*.md'
      - '.github/readme.md'
      - 'docs/'
      - 'examples/'

jobs:
  # Charts only — no Go build, so no private-module auth needed.
  chart-tests:
    name: Chart Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint charts and run render tests
        run: make helm-lint helm-render-test

  operator-pull-request:
    name: Operator Pull Request
    uses: stakater/.github/.github/workflows/operator_pull_request.yaml@main
    secrets:
      CONTAINER_REGISTRY_URL: ghcr.io/stakater
      CONTAINER_REGISTRY_USERNAME: stakater-user
      CONTAINER_REGISTRY_PASSWORD: ${{ secrets.GHCR_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.STAKATER_DELIVERY_SLACK_WEBHOOK }}
      STAKATER_AB_REPOS: ${{ secrets.STAKATER_AB_REPOS }}
    with:
      ENABLE_LINTING: true
      ENABLE_UNIT_TESTS: true
      ENABLE_STAKATER_AB_GIT_AUTH: true
      GO_VERSION: "1.26"
