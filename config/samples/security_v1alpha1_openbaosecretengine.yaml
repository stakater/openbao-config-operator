apiVersion: security.mto.stakater.com/v1alpha1
kind: OpenBaoSecretEngine
metadata:
  name: secret-kv
  namespace: openbao-config-operator-system
spec:
  # Bao-side mount path. Trailing slashes are stripped before the API call.
  path: secret
  description: cluster-shared kv-v2 secret engine
  # spec.openbaoNamespace targets a specific OpenBao namespace via the
  # X-Vault-Namespace header. Empty (the default) means root.
  # openbaoNamespace: acme/

  # Exactly one of the engine slots must be set. KvV2 is the most common
  # for tenant secret storage.
  kvV2: {}
