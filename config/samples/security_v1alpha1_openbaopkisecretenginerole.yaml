apiVersion: security.mto.stakater.com/v1alpha1
kind: OpenBaoPKISecretEngineRole
metadata:
  name: web-server
  namespace: openbao-config-operator-system
spec:
  # Path must match an existing OpenBaoSecretEngine of kind=pki at the
  # same path; that mount must also have a CA configured (typically via
  # OpenBaoPKISecretEngineConfig) before issued certs work.
  path: pki

  # spec.name defaults to metadata.name when omitted.
  # name: web-server

  allowedDomains:
    - "*.demo.example.com"
  allowSubdomains: true
  serverFlag: true

  keyType: rsa
  keyBits: 2048

  ttl: "720h"
  maxTtl: "8760h"
