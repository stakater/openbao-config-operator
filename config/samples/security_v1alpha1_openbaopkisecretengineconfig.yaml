# Mode 1 — self-signed root CA. The key never leaves bao.
apiVersion: security.mto.stakater.com/v1alpha1
kind: OpenBaoPKISecretEngineConfig
metadata:
  name: pki-root
  namespace: openbao-config-operator-system
spec:
  # Path must match an existing OpenBaoSecretEngine of kind=pki at the
  # same path; this CR populates the mount, it does not enable it.
  path: pki-root

  # Optional: scope into a specific OpenBao namespace.
  # openbaoNamespace: acme/

  type: root
  commonName: "Demo Root CA"

  # Validity. Bao default is short — set this for any real CA.
  TTL: "87600h"  # 10 years

  # Key algorithm. Defaults: rsa / 2048.
  keyType: rsa
  keyBits: 4096

  # Subject fields are flat (single strings).
  organization: "Stakater Demo"
  ou: "Platform"
  country: "US"

  # AIA / CRL URLs published in issued certs.
  issuingCertificates:
    - "https://bao.example.com/v1/pki-root/ca"
  CRLDistributionPoints:
    - "https://bao.example.com/v1/pki-root/crl"
---
# Mode 2 — intermediate CA signed in-bao by a root mount (internalSign).
# The root must live in the SAME OpenBao namespace as this intermediate.
# Fully automated: one reconcile generates the CSR, signs it, and binds
# the signed cert.
apiVersion: security.mto.stakater.com/v1alpha1
kind: OpenBaoPKISecretEngineConfig
metadata:
  name: pki-intermediate
  namespace: openbao-config-operator-system
spec:
  path: pki-int
  type: intermediate
  commonName: "Demo Intermediate CA"
  TTL: "43800h"  # 5 years
  # internalSign.name is the root MOUNT path (not a k8s object), in the
  # same OpenBao namespace as this CR.
  internalSign:
    name: pki-root
  # X.509 name constraints: this intermediate may only issue for these
  # DNS domains (RFC 5280).
  permittedDnsDomains:
    - "svc.cluster.local"
---
# Mode 3 — intermediate CA signed by an offline root (externalSignSecret).
# Multi-step: the operator generates a CSR into a Secret named
# "<cr-name>-intermediate-csr" and waits (Ready=False,
# reason=AwaitingExternalSignature) until the signed cert is placed in the
# referenced Secret under certificateKey.
apiVersion: security.mto.stakater.com/v1alpha1
kind: OpenBaoPKISecretEngineConfig
metadata:
  name: pki-intermediate-external
  namespace: openbao-config-operator-system
spec:
  path: pki-ext
  type: intermediate
  commonName: "Demo Offline-Signed Intermediate CA"
  TTL: "43800h"
  externalSignSecret:
    name: demo-signed-ca
  certificateKey: tls.crt  # default; shown for clarity
  permittedDnsDomains:
    - "demo-api.svc.cluster.local"
