apiVersion: security.mto.stakater.com/v1alpha1
kind: OpenBaoKubernetesAuthRole
metadata:
  name: prod-deployers
  namespace: openbao-config-operator-system
spec:
  # Auth mount path; bao writes to auth/<path>/role/<metadata.name>.
  path: kubernetes
  # spec.name defaults to metadata.name; set it if the bao-side role name
  # must differ from the Kubernetes resource name.
  # spec.openbaoNamespace targets a specific OpenBao namespace via the
  # X-Vault-Namespace header. Empty (the default) means root.
  policies:
    - prod-deploy-policy
  targetServiceAccounts:
    - deployer
  # Static list of target namespaces. Use this when the namespace set is
  # known at apply time and does not move. For label-driven binding, see
  # security_v1alpha1_openbaokubernetesauthrole_selector.yaml.
  targetNamespaces:
    targetNamespaces:
      - prod-app-1
      - prod-app-2
  tokenTTL: 1h
  tokenMaxTTL: 2h
  tokenType: service
