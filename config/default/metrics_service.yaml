apiVersion: v1
kind: Service
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: openbao-config-operator
    app.kubernetes.io/managed-by: kustomize
  # Kept short: the Helm chart prefixes this with the release name, and
  # "<release>-openbao-config-operator-..." has to stay inside 63 characters.
  name: metrics-service
  namespace: system
spec:
  ports:
  - name: https
    port: 8443
    protocol: TCP
    targetPort: 8443
  selector:
    control-plane: controller-manager
