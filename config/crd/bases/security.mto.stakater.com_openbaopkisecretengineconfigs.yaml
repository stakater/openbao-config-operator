---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: openbaopkisecretengineconfigs.security.mto.stakater.com
spec:
  group: security.mto.stakater.com
  names:
    kind: OpenBaoPKISecretEngineConfig
    listKind: OpenBaoPKISecretEngineConfigList
    plural: openbaopkisecretengineconfigs
    shortNames:
    - obpkic
    singular: openbaopkisecretengineconfig
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          OpenBaoPKISecretEngineConfig is the Schema for the
          openbaopkisecretengineconfigs API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              OpenBaoPKISecretEngineConfigSpec defines the desired state. Field set, names,
              json tags, and defaults match upstream redhat-cop/vault-config-operator
              exactly, except spec.connection/spec.authentication are dropped (single-token
              model) and spec.openbaoNamespace is added.
            properties:
              CRLDisable:
                description: CRLDisable turns off CRL building.
                type: boolean
              CRLDistributionPoints:
                description: CRLDistributionPoints are the CRL distribution-point
                  URLs.
                items:
                  type: string
                type: array
              CRLExpiry:
                default: 72h
                description: CRLExpiry is the CRL rotation period (bao duration).
                type: string
              IPSans:
                description: IPSans is a comma-separated list of IP subject-alternative
                  names.
                type: string
              TTL:
                description: |-
                  TTL is the validity period of the CA cert (bao duration). Empty = bao
                  default.
                type: string
              URISans:
                description: URISans is a comma-separated list of URI subject-alternative
                  names.
                type: string
              altNames:
                description: AltNames is a comma-separated list of subject-alternative
                  DNS/email names.
                type: string
              certificateKey:
                default: tls.crt
                description: |-
                  CertificateKey is the key within ExternalSignSecret holding the signed
                  cert PEM.
                type: string
              commonName:
                description: CommonName is the X.509 CN of the generated CA cert.
                maxLength: 253
                minLength: 1
                type: string
              country:
                description: Country is the X.509 subject Country.
                type: string
              excludeCnFromSans:
                description: ExcludeCnFromSans omits the CN from the generated SANs.
                type: boolean
              externalSignSecret:
                description: |-
                  ExternalSignSecret references a Secret holding the externally-signed
                  intermediate cert (offline-root signing). Mutually exclusive with
                  InternalSign. type=intermediate only.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              format:
                default: pem
                description: Format is the output format of the issued cert.
                enum:
                - pem
                - pem_bundle
                - der
                type: string
              internalSign:
                description: |-
                  InternalSign points at a signing CA mount that signs this intermediate's
                  CSR in-bao. Mutually exclusive with ExternalSignSecret. type=intermediate
                  only. By default the signing CA must live in this CR's openbaoNamespace;
                  set internalSign.openbaoNamespace to sign against a CA in a different
                  OpenBao namespace (e.g. a platform CA signing per-tenant intermediates).
                properties:
                  name:
                    description: Name is the signing CA's bao mount path (e.g. "pki-platform").
                    maxLength: 128
                    minLength: 1
                    pattern: ^[a-zA-Z0-9][a-zA-Z0-9_./-]*$
                    type: string
                  openbaoNamespace:
                    description: |-
                      OpenBaoNamespace is the signing CA's OpenBao namespace. Empty = the
                      intermediate CR's own openbaoNamespace (same-namespace signing — the
                      historical behavior). Set this to sign against a CA in another namespace.
                    pattern: ^([a-z0-9]([-a-z0-9/]*[a-z0-9])?/?)?$
                    type: string
                required:
                - name
                type: object
              issuingCertificates:
                description: IssuingCertificates are the AIA issuing-cert URLs published
                  in issued certs.
                items:
                  type: string
                type: array
              keyBits:
                default: 2048
                description: KeyBits is the key size in bits.
                type: integer
              keyType:
                default: rsa
                description: KeyType is the public-key algorithm.
                enum:
                - rsa
                - ec
                type: string
              locality:
                description: Locality is the X.509 subject Locality.
                type: string
              maxPathLength:
                default: -1
                description: MaxPathLength is the CA's pathlen basic constraint. -1
                  = no limit.
                type: integer
              ocspServers:
                description: OCSPServers are the OCSP responder URLs.
                items:
                  type: string
                type: array
              openbaoNamespace:
                description: |-
                  OpenBaoNamespace targets a specific OpenBao namespace via
                  X-Vault-Namespace. Empty = root. Replaces upstream's
                  authentication.namespace.
                pattern: ^([a-z0-9]([-a-z0-9/]*[a-z0-9])?/?)?$
                type: string
              organization:
                description: Organization is the X.509 subject Organization.
                type: string
              otherSans:
                description: OtherSans is a comma-separated list of custom OID SANs.
                type: string
              ou:
                description: OU is the X.509 subject Organizational Unit.
                type: string
              path:
                description: |-
                  Path is the bao-side PKI mount path (e.g. "pki", "pki/internal"). Must
                  match an existing OpenBaoSecretEngine of kind=pki at the same path; the
                  controller does NOT enable the mount itself.
                maxLength: 128
                minLength: 1
                pattern: ^[a-zA-Z0-9][a-zA-Z0-9_./-]*$
                type: string
              permittedDnsDomains:
                description: |-
                  PermittedDnsDomains is the X.509 name-constraints DNS allow-list applied
                  to the CA cert.
                items:
                  type: string
                type: array
              postalCode:
                description: PostalCode is the X.509 subject Postal Code.
                type: string
              privateKeyFormat:
                description: PrivateKeyFormat is the output format of the private
                  key.
                type: string
              privateKeyType:
                default: internal
                description: |-
                  PrivateKeyType controls whether the generated key stays internal to bao
                  or is exported.
                enum:
                - internal
                - exported
                type: string
              province:
                description: Province is the X.509 subject Province.
                type: string
              publishCABundleConfigMap:
                description: |-
                  PublishCABundleConfigMap, when set, names a ConfigMap (in this CR's
                  namespace) the controller keeps populated with the active CA cert PEM
                  (key "ca.crt"), plus the CA that key held before the last change
                  (key "ca-previous.crt") so both stay trustable while certs issued by the
                  outgoing CA are still in use. It exists so a trust-distribution tool
                  (cert-manager trust-manager) can source this CA for cross-tenant trust
                  bundles; sources must take every key, not just "ca.crt", to get the
                  overlap. Empty = don't publish. The ConfigMap is owner-ref'd to this CR
                  (GC on delete).
                maxLength: 253
                pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                type: string
              serialNumber:
                description: SerialNumber is the X.509 subject Serial Number (not
                  the cert serial).
                type: string
              streetAddress:
                description: StreetAddress is the X.509 subject Street Address.
                type: string
              type:
                default: root
                description: Type selects root vs intermediate CA generation.
                enum:
                - root
                - intermediate
                type: string
            required:
            - commonName
            - path
            - type
            type: object
          status:
            description: OpenBaoPKISecretEngineConfigStatus defines the observed state.
            properties:
              baoWritten:
                description: BaoWritten records whether this CR has ever successfully
                  written a CA.
                type: boolean
              caSerialNumber:
                description: CASerialNumber is the X.509 serial of the active CA cert.
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              exported:
                description: Exported records that the CSR was exported to its Secret
                  (upstream).
                type: boolean
              generated:
                description: Generated records that the intermediate CSR was generated
                  (upstream).
                type: boolean
              lastWrittenBaoName:
                description: LastWrittenBaoName records the PKI mount path last written
                  into.
                type: string
              lastWrittenOpenBaoNamespace:
                description: LastWrittenOpenBaoNamespace tracks the bao namespace
                  context.
                type: string
              phase:
                description: |-
                  Phase tracks the CA-bootstrap state: "" → Active, or
                  AwaitingExternalSignature for an external-sign intermediate.
                type: string
              signed:
                description: Signed records that the intermediate was signed + set-signed
                  (upstream).
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
