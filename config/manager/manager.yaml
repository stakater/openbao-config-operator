apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: openbao-config-operator
    app.kubernetes.io/managed-by: kustomize
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: openbao-config-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
    spec:
      # TODO(user): Uncomment the following code to configure the nodeAffinity expression
      # according to the platforms which are supported by your solution.
      # It is considered best practice to support multiple architectures. You can
      # build your manager image using the makefile target docker-buildx.
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #           - key: kubernetes.io/arch
      #             operator: In
      #             values:
      #               - amd64
      #               - arm64
      #               - ppc64le
      #               - s390x
      #           - key: kubernetes.io/os
      #             operator: In
      #             values:
      #               - linux
      securityContext:
        runAsNonRoot: true
        # TODO(user): For common cases that do not require escalating privileges
        # it is recommended to ensure that all your Pods/Containers are restrictive.
        # More info: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        # Please uncomment the following code if your project does NOT have to work on old Kubernetes
        # versions < 1.19 or on vendors versions which do NOT support this field by default (i.e. Openshift < 4.11 ).
        # seccompProfile:
        #   type: RuntimeDefault
      containers:
      - command:
        - /manager
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
        
        env:
          # Own namespace, for objects the operator stores about itself (the
          # HMAC key Secret). Downward API rather than a literal so the
          # operator works in whatever namespace it is installed into;
          # without it, bootstrapHMACComputer falls back to a hardcoded
          # namespace and startup fails anywhere else.
          - name: OPERATOR_NS
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          # The operator holds no bao credential: it logs in at
          # auth/k8s-operator/login with the projected ServiceAccount token
          # below (see hack/e2e/openbao/bootstrap_operator_auth.sh for the
          # bao-side mount/policy/role). Set BAO_AUTH_METHOD=token plus a
          # VAULT_TOKEN env to fall back to static-token mode.
          - name: BAO_AUTH_METHOD
            value: kubernetes
          - name: BAO_AUTH_JWT_PATH
            value: /var/run/secrets/openbao/token
          - name: VAULT_ADDR
            valueFrom:
              configMapKeyRef:
                name: controller-manager-config
                key: VAULT_ADDR
        image: controller:latest
        imagePullPolicy: IfNotPresent
        name: manager
        volumeMounts:
          - name: bao-sa-token
            mountPath: /var/run/secrets/openbao
            readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        # TODO(user): Configure the resources accordingly based on the project requirements.
        # More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
      volumes:
        # Audience-bound projected SA token for bao login: useless against
        # the API server (wrong audience), and the pod's API-server token is
        # equally useless against bao. Kubelet rotates it; the client
        # re-reads the file on every login.
        - name: bao-sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: openbao
                  expirationSeconds: 3600
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
